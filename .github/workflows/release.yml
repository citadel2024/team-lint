name: Build and Release

on:
    push:
        branches:
            - master
permissions:
    contents: write
    packages: write

jobs:
    release:
        name: release
        runs-on: ubuntu-latest
        permissions:
            contents: write # to be able to publish a GitHub release
            packages: write # to be able to publish a package to GitHub Packages
            issues: write # to be able to comment on released issues
            pull-requests: write # to be able to comment on released pull requests
        steps:
            - uses: actions/checkout@v6

            - name: Install bun
              uses: oven-sh/setup-bun@v2

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock', 'package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-



            - name: Install deps
              run: bun i

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

            - name: Release
              run: bun run release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
